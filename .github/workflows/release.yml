name: Release extension

# Push a tag like v0.1.0 to build the extension zip and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test tests/analyze.test.js
      - name: Tag must match manifest version
        run: |
          v=$(python -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != manifest v$v"; exit 1; }
      - name: Build site and extension
        run: python build.py
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/safarnameh-extension-*.zip \
            --title "سفرنامه ${GITHUB_REF_NAME}" --generate-notes
